<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="800" viewBox="0 0 1000 800">
  <defs>
    <style>
      .bg { fill: #f5f5f5 }
      .title-main { font: bold 24px 'Segoe UI', sans-serif; fill: #1a1a1a }
      .title-section { font: bold 14px 'Segoe UI', sans-serif; fill: #ffffff }
      .label-text { font: 13px 'Segoe UI', sans-serif; fill: #1a1a1a }
      .sublabel { font: 11px 'Segoe UI', sans-serif; fill: #555555 }
      .rg-box { fill: none; stroke: #0078d4; stroke-width: 3; stroke-dasharray: 5,5 }
      .vnet-box { fill: #e7f3ff; stroke: #0078d4; stroke-width: 2 }
      .subnet-box { fill: #f0f8ff; stroke: #0078d4; stroke-width: 1.5 }
      .vm-windows { fill: #fff4ce; stroke: #ff8c00; stroke-width: 2 }
      .vm-linux { fill: #e6f7ff; stroke: #0078d4; stroke-width: 2 }
      .nsg { fill: #fff0f5; stroke: #d946ef; stroke-width: 2 }
      .arrow { stroke: #666666; stroke-width: 2; fill: none; stroke-dasharray: 3,3 }
      .arrow-solid { stroke: #333333; stroke-width: 2; fill: none }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333333"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1000" height="800" class="bg"/>

  <!-- Title -->
  <text x="50" y="40" class="title-main">Azure AD Linux Lab Architecture</text>

  <!-- Resource Group Container -->
  <rect x="40" y="70" width="920" height="710" class="rg-box"/>
  <text x="55" y="90" class="label-text" style="fill: #0078d4; font-weight: bold">Resource Group: Anthony-Lab-RG (East US2)</text>

  <!-- VNet Container -->
  <rect x="60" y="110" width="880" height="650" class="vnet-box" rx="8"/>
  <text x="75" y="135" class="title-section" style="background: #0078d4; padding: 5px; fill: #0078d4">Virtual Network: lab-vnet (10.0.0.0/16)</text>

  <!-- Management Subnet -->
  <rect x="80" y="160" width="400" height="280" class="subnet-box" rx="6"/>
  <text x="100" y="185" class="title-section" style="background: #0078d4; color: white; padding: 3px; font-size: 12px; fill: white">Management Subnet (10.0.1.0/24)</text>

  <!-- Windows VM in Management -->
  <rect x="100" y="210" width="360" height="100" class="vm-windows" rx="6"/>
  <text x="120" y="235" class="label-text" style="font-weight: bold">win-mgmt-01</text>
  <text x="120" y="255" class="sublabel">Windows Server 2022 (B2s)</text>
  <text x="120" y="270" class="sublabel">Private IP: 10.0.1.10</text>
  <text x="120" y="285" class="sublabel">Function: AD Management</text>

  <!-- Services Subnet -->
  <rect x="520" y="160" width="400" height="280" class="subnet-box" rx="6"/>
  <text x="540" y="185" class="title-section" style="background: #0078d4; color: white; padding: 3px; font-size: 12px; fill: white">Services Subnet (10.0.2.0/24)</text>

  <!-- Linux VM in Services -->
  <rect x="540" y="210" width="360" height="100" class="vm-linux" rx="6"/>
  <text x="560" y="235" class="label-text" style="font-weight: bold">linux-srv-01</text>
  <text x="560" y="255" class="sublabel">Ubuntu 22.04 LTS (B1s)</text>
  <text x="560" y="270" class="sublabel">Private IP: 10.0.2.10</text>
  <text x="560" y="285" class="sublabel">Function: Services (Web, DNS, Samba)</text>

  <!-- AD Domain Controller info box -->
  <rect x="100" y="330" width="360" height="90" class="vm-linux" rx="6"/>
  <text x="120" y="355" class="label-text" style="font-weight: bold">Active Directory Domain</text>
  <text x="120" y="375" class="sublabel">Primary DC: dc01</text>
  <text x="120" y="390" class="sublabel">NETBIOS: LAB</text>
  <text x="120" y="405" class="sublabel">Managed via AD_config.ps1 (Windows)</text>

  <!-- Samba/Services info box -->
  <rect x="540" y="330" width="360" height="90" class="vm-linux" rx="6"/>
  <text x="560" y="355" class="label-text" style="font-weight: bold">Linux Services</text>
  <text x="560" y="375" class="sublabel">• SSSD + PAM (AD integration)</text>
  <text x="560" y="390" class="sublabel">• Samba file sharing</text>
  <text x="560" y="405" class="sublabel">• Dynamic IP management</text>

  <!-- Network Connectivity -->
  <line x1="280" y1="310" x2="280" y2="330" class="arrow-solid" marker-end="url(#arrowhead)"/>
  <line x1="720" y1="310" x2="720" y2="330" class="arrow-solid" marker-end="url(#arrowhead)"/>

  <!-- NSG Container -->
  <rect x="80" y="480" width="840" height="110" class="nsg" rx="6"/>
  <text x="100" y="505" class="title-section" style="background: #d946ef; color: white; padding: 3px; font-size: 12px; fill: white">Network Security Group (NSG)</text>
  <text x="100" y="530" class="sublabel">• RDP (3389) → Windows: Restricted to trusted IPs</text>
  <text x="100" y="548" class="sublabel">• SSH (22) → Linux: Restricted to trusted IPs</text>
  <text x="100" y="566" class="sublabel">• Intra-VNet: All traffic allowed (subnet communication)</text>

  <!-- Key Components Legend -->
  <rect x="80" y="620" width="840" height="130" fill="#fafafa" stroke="#cccccc" stroke-width="1" rx="6"/>
  <text x="100" y="645" class="label-text" style="font-weight: bold">Key Components & Files</text>

  <text x="100" y="670" class="sublabel">📁 Terraform/ → Infrastructure as Code (IaC) for Azure deployment</text>
  <text x="100" y="688" class="sublabel">📁 Linux/ → Bash scripts for VM configuration (SSSD, Samba, Dynamic IP)</text>
  <text x="100" y="706" class="sublabel">📁 AD/ → PowerShell scripts for Active Directory setup and group policies</text>
  <text x="100" y="724" class="sublabel">⚙️ Deploy: terraform init → terraform plan → terraform apply</text>
  <text x="100" y="742" class="sublabel">🔐 Secrets: Keep terraform.tfvars locally (never commit); use Azure Key Vault for CI/CD</text>
</svg>
