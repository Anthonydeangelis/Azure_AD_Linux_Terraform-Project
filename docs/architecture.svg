<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700">
  <style>
    .rg { fill:#f7fbff; stroke:#2b6cb0; stroke-width:2 }
    .vnet { fill:#ffffff; stroke:#2b6cb0; stroke-width:1.5 }
    .subnet { fill:#f0f7ff; stroke:#3182ce; stroke-width:1 }
    .vm { fill:#fff; stroke:#2d3748; stroke-width:1.2 }
    .title { font: bold 16px sans-serif; fill:#2d3748 }
    .label { font: 13px sans-serif; fill:#2d3748 }
    .ip { font: 12px monospace; fill:#2d3748 }
    .legend { font: 13px sans-serif; fill:#2d3748 }
    .note { font: 12px sans-serif; fill:#4a5568 }
    .arrow { stroke:#2d3748; stroke-width:1.2; marker-end:url(#arrowhead) }
  </style>

  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2d3748"/>
    </marker>
  </defs>

  <!-- Resource Group -->
  <rect x="20" y="20" width="760" height="600" rx="8" class="rg"/>
  <text x="36" y="44" class="title">Resource Group: Anthony-Lab-RG</text>

  <!-- VNet -->
  <rect x="40" y="70" width="520" height="420" rx="6" class="vnet"/>
  <text x="56" y="96" class="label">Virtual Network: lab-vnet</text>
  <text x="56" y="116" class="ip">Address space: 10.0.0.0/16</text>

  <!-- Subnets -->
  <rect x="56" y="140" width="480" height="140" rx="6" class="subnet"/>
  <text x="72" y="162" class="label">Management subnet</text>
  <text x="72" y="182" class="ip">10.0.1.0/24</text>

  <rect x="56" y="300" width="480" height="140" rx="6" class="subnet"/>
  <text x="72" y="322" class="label">Services subnet</text>
  <text x="72" y="342" class="ip">10.0.2.0/24</text>

  <!-- Management VM (Windows) -->
  <rect x="420" y="160" width="200" height="60" rx="6" class="vm"/>
  <text x="440" y="182" class="label">win-mgmt-01 (Windows)</text>
  <text x="440" y="200" class="ip">Private IP: 10.0.1.10</text>
  <text x="440" y="216" class="ip">NIC: mgmt-server-nic</text>

  <!-- Linux VM (Services) -->
  <rect x="420" y="320" width="200" height="60" rx="6" class="vm"/>
  <text x="440" y="342" class="label">linux-srv-01 (Ubuntu)</text>
  <text x="440" y="360" class="ip">Private IP: 10.0.2.10</text>
  <text x="440" y="376" class="ip">NIC: services-server-nic</text>

  <!-- AD Domain Controller (logical) -->
  <g>
    <rect x="120" y="200" width="220" height="120" rx="6" class="vm"/>
    <text x="138" y="226" class="label">Active Directory (DC)</text>
    <text x="138" y="246" class="ip">Hostname: dc01</text>
    <text x="138" y="266" class="ip">Private IP (example): 10.0.1.20</text>
  </g>

  <!-- Connections (arrows) -->
  <line x1="300" y1="260" x2="420" y2="190" class="arrow"/>
  <line x1="300" y1="260" x2="420" y2="350" class="arrow"/>

  <!-- Network Security Group (logical) -->
  <rect x="590" y="60" width="180" height="80" rx="6" fill="#fff8e6" stroke="#d69e2e"/>
  <text x="600" y="86" class="label">Network Security Group (NSG)</text>
  <text x="600" y="104" class="note">Applied to subnets / NICs. Limit RDP/SSH to trusted IPs.</text>

  <!-- Legend and documentation -->
  <rect x="820" y="20" width="260" height="620" rx="6" fill="#f7f9fb" stroke="#e2e8f0"/>
  <text x="840" y="46" class="title">Architecture Legend & Notes</text>

  <text x="840" y="78" class="legend">VNet: lab-vnet — 10.0.0.0/16</text>
  <text x="840" y="100" class="legend">Management subnet — 10.0.1.0/24</text>
  <text x="840" y="122" class="legend">Services subnet — 10.0.2.0/24</text>

  <text x="840" y="152" class="legend">win-mgmt-01</text>
  <text x="920" y="152" class="ip">10.0.1.10</text>

  <text x="840" y="176" class="legend">linux-srv-01</text>
  <text x="920" y="176" class="ip">10.0.2.10</text>

  <text x="840" y="200" class="legend">dc01 (AD DC)</text>
  <text x="920" y="200" class="ip">10.0.1.20</text>

  <text x="840" y="236" class="note">Notes:</text>
  <text x="840" y="256" class="note">- Replace example IPs with values from terraform.tfvars.</text>
  <text x="840" y="276" class="note">- Keep terraform.tfvars out of source control; use Azure Key Vault for secrets.</text>
  <text x="840" y="296" class="note">- Use remote state (Az storage / backend) for team collaboration.</text>

  <text x="840" y="336" class="note">Terraform files:</text>
  <text x="840" y="356" class="note">- Terraform/main.tf: core resources (already tracked)</text>
  <text x="840" y="376" class="note">- Terraform/network.tf: networking (committed)</text>
  <text x="840" y="396" class="note">- Terraform/compute.tf: VM definitions (untracked; may contain secrets)</text>
  <text x="840" y="416" class="note">- Terraform/terraform.tfvars: local secrets (do NOT commit)</text>

  <text x="840" y="456" class="note">Operational:</text>
  <text x="840" y="476" class="note">- To deploy: terraform init → plan → apply</text>
  <text x="840" y="496" class="note">- For CI: store credentials in GitHub Secrets and use azure/login action</text>

  <text x="840" y="540" class="note">Generated: architecture.svg — example IPs shown for documentation.</text>
  <text x="840" y="560" class="note">Edit the SVG to update IPs or labels as needed.</text>
</svg>
